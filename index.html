    <script>
      // Prevent flash of wrong theme
      (function () {
        var t = localStorage.getItem("theme");
        if (t === "dark" || (!t && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <script>
      // GitHub Pages SPA redirect decoder — restores the original deep-link URL
      // written by public/404.html before React Router boots.
      (function () {
        var l = window.location;
        if (l.search.indexOf("?p=/") === 0 || l.search.indexOf("&p=/") > -1) {
          var q = l.search.slice(1).split("&").reduce(function (acc, pair) {
            var i = pair.indexOf("=");
            acc[pair.slice(0, i)] = pair.slice(i + 1);
            return acc;
          }, {});
          if (q.p !== undefined) {
            var path = q.p.replace(/~and~/g, "&");
            var query = q.q ? "?" + q.q.replace(/~and~/g, "&") : "";
            window.history.replaceState(null, "", path + query + l.hash);
          }
        }
      })();
    </script>
